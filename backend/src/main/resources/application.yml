server:
  port: 8135

spring:
  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}

api-gateway:
  internal-signing-secret: local-test-gateway-signing-secret
  upstreams:
    portal-core-base-url: http://127.0.0.1:8134
    ops-core-base-url: http://127.0.0.1:8133

beiming:
  admin:
    test-mode: true
  admission-core:
    test-control-headers:
      enabled: false

onboarding:
  test-controls:
    enabled: false

exam:
  test-controls:
    enabled: false

whitelist:
  test-controls:
    enabled: false

attendance:
  test-controls:
    enabled: false

community:
  test-controls:
    enabled: false

activity:
  test-controls:
    enabled: false

calendar:
  test-controls:
    enabled: false

changelog:
  test-controls:
    enabled: false

ops-core:
  test-controls:
    enabled: false
  http-smoke:
    gateway-base-url: http://127.0.0.1:8135
    timeout-ms: 1500

ops-control:
  test-controls:
    enabled: false

cloudreve-sync:
  test-controls:
    enabled: false

backup-recovery:
  test-controls:
    enabled: false

alerting:
  test-controls:
    enabled: false

plugin-integration:
  test-controls:
    enabled: false

cross-platform-notification:
  test-controls:
    enabled: false

ops-image-market:
  test-controls:
    enabled: false

portal-core:
  test-controls:
    enabled: false
  http-smoke:
    gateway-base-url: http://127.0.0.1:8135
    timeout-ms: 1500

guide:
  test-controls:
    enabled: ${portal-core.test-controls.enabled:false}

material:
  test-controls:
    enabled: ${portal-core.test-controls.enabled:false}

online-map:
  test-controls:
    enabled: ${portal-core.test-controls.enabled:false}
