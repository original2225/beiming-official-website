server:
  port: 8117

node-daemon:
  service: node-daemon
  node-id: ${NODE_DAEMON_NODE_ID:node-main}
  node-token: ${NODE_DAEMON_NODE_TOKEN:node-token-valid}
  node-signing-secret: ${NODE_DAEMON_SIGNING_SECRET:local-node-signing-secret}
  allowed-clock-skew-seconds: ${NODE_DAEMON_ALLOWED_CLOCK_SKEW_SECONDS:300}
  test-controls:
    enabled: false
