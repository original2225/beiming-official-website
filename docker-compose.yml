services:
  postgres:
    image: postgres:16-alpine
    container_name: beiming-postgres
    env_file:
      - compose.local.env
    volumes:
      - beiming-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beiming-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - compose.local.env
    environment:
      SPRING_AUTOCONFIGURE_EXCLUDE: ""
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beiming
      SPRING_DATASOURCE_USERNAME: $${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: $${POSTGRES_PASSWORD}
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "8135:8135"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8135/api/v1/unified-backend/health | grep -q '\"code\":0'"]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 10

volumes:
  beiming-postgres-data:
